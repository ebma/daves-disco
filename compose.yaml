services:
  bot:
    build: .
    image: daves-disco:3
    restart: unless-stopped
    env_file: .env
    mem_limit: 512m
    # burner-account cookie file (gitignored). Create an empty cookies.txt if you have none,
    # and set YTDLP_COOKIES=/app/cookies.txt in .env to use it.
    volumes:
      - ./cookies.txt:/app/cookies.txt
